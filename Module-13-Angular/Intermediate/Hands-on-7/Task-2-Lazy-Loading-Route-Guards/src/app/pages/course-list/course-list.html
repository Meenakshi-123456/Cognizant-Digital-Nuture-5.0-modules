<h2>Course List</h2>


<input
type="text"
[(ngModel)]="searchTerm"
placeholder="Search courses"
/>


<button (click)="searchCourses()">
Search
</button>
<h2>Course List</h2>


<div 
*ngFor="let course of courses"
(click)="openCourse(course.id)"
>


<h3>{{course.name}}</h3>

<p>{{course.description}}</p>


</div>
