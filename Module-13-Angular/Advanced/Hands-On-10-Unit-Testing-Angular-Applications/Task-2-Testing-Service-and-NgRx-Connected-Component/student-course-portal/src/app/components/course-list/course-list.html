<h2>Course List</h2>

<div *ngIf="loading$ | async">
  <p>Loading...</p>
</div>

<div *ngIf="!(loading$ | async)">

  <div *ngFor="let course of (courses$ | async)">

    <h3>{{ course.name }}</h3>

    <p>
      Duration: {{ course.duration }}
    </p>

    <p>
      Fee: {{ course.fee }}
    </p>

    <button (click)="toggleEnrollment(course.id)">
      Enroll
    </button>

  </div>

</div>
