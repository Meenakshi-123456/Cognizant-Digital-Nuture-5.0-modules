<p *ngIf="errorMessage">
  {{errorMessage}}
</p>
<h2>Course List</h2>

<ul>
  <li *ngFor="let course of courses">

    {{course.name}} - {{course.duration}} - ₹{{course.fee}}

    <button (click)="updateCourse(course)">
      Edit
    </button>

    <button (click)="deleteCourse(course.id!)">
      Delete
    </button>

  </li>
</ul>
