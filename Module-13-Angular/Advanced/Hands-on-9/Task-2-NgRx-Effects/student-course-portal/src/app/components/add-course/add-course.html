<h2>Add Course</h2>


<label>
Course Name:
</label>

<input 
[(ngModel)]="course.name">


<br>


<label>
Duration:
</label>

<input 
[(ngModel)]="course.duration">


<br>


<label>
Fee:
</label>

<input 
type="number"
[(ngModel)]="course.fee">


<br>


<label>
Credits:
</label>

<input 
type="number"
[(ngModel)]="course.credits">


<br>


<button (click)="addCourse()">

Add Course

</button>
